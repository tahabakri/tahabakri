      <rect x="66" y="-9" width="46" height="15" fill="rgba(90,95,105,0.22)" transform="rotate(-4 89 -1.5)"/>
      <text x="91" y="40" text-anchor="middle" font-family="'Comic Sans MS','Comic Neue',cursive" font-size="18" font-weight="700" fill="#08384f">notion-bases</text>
      <text x="91" y="65" text-anchor="middle" font-family="'Comic Sans MS','Comic Neue',cursive" font-size="13" font-weight="700" fill="#136080">npx → Obsidian</text>
    </g>

    <g transform="translate(96,288) rotate(5)">
      <animateTransform attributeName="transform" type="translate" additive="sum" values="0 0;0 -6;0 0" dur="4.8s" repeatCount="indefinite"/>
      <rect x="4" y="6" width="176" height="92" fill="rgba(0,0,0,0.06)"/>
      <rect width="176" height="92" fill="#ffef9d"/>
      <rect x="62" y="-9" width="46" height="15" fill="rgba(90,95,105,0.22)" transform="rotate(6 85 -1.5)"/>
      <text x="88" y="40" text-anchor="middle" font-family="'Comic Sans MS','Comic Neue',cursive" font-size="19" font-weight="700" fill="#5a4500">StaffLoop</text>
      <text x="88" y="65" text-anchor="middle" font-family="'Comic Sans MS','Comic Neue',cursive" font-size="13" font-weight="700" fill="#856600">event staffing · UAE</text>
    </g>

    <g transform="translate(916,286) rotate(-6)">
      <animateTransform attributeName="transform" type="translate" additive="sum" values="0 0;0 6;0 0" dur="5.6s" repeatCount="indefinite"/>
      <rect x="4" y="6" width="182" height="92" fill="rgba(0,0,0,0.06)"/>
      <rect width="182" height="92" fill="#ffc4a6"/>
      <rect x="66" y="-9" width="46" height="15" fill="rgba(90,95,105,0.22)" transform="rotate(-6 89 -1.5)"/>
      <text x="91" y="40" text-anchor="middle" font-family="'Comic Sans MS','Comic Neue',cursive" font-size="18" font-weight="700" fill="#7a2e0c">event apps</text>
      <text x="91" y="65" text-anchor="middle" font-family="'Comic Sans MS','Comic Neue',cursive" font-size="13" font-weight="700" fill="#9a4a22">&amp; marketplaces</text>
    </g>

    <path d="M4.037 4.688a.495.495 0 0 1 .651-.651l16 6.5a.5.5 0 0 1-.063.947l-6.124 1.58a2 2 0 0 0-1.438 1.435l-1.579 6.126a.5.5 0 0 1-.947.063z" fill="#13a8ff" stroke="#050505" stroke-width="1.4" transform="scale(1.15)">
      <animateMotion dur="12s" repeatCount="indefinite" rotate="0" path="M300 332 C 380 150 520 140 615 178 S 920 168 968 252 S 760 372 545 356 S 330 374 300 332 Z"/>
    </path>
