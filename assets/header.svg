  <text x="64" y="150" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="66" font-weight="700" letter-spacing="-2" fill="#f2f5fa">taha bakri</text>
  <text x="66" y="192" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#8b95a7">builder · tbilisi  —  i make web things that move, and saas that won’t lose your data.</text>

  <g font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="15">
    <circle cx="72" cy="227" r="4" fill="#3fb950"/>
    <text x="86" y="232" fill="#aab4c5">now building</text>
    <text x="178" y="232" fill="#e6ebf2" font-weight="700">restora.cc</text>
    <text x="278" y="232" fill="#5a6577">·</text>
    <text x="292" y="232" fill="#e6ebf2" font-weight="700">notion-bases</text>
