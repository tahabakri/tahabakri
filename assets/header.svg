<svg width="100%" viewBox="0 0 1200 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="taha bakri — builder, tbilisi. A brainstorm board with sticky notes: Restora, notion-bases, StaffLoop, event marketplaces.">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ededea" stroke-width="1"/>
    </pattern>
    <clipPath id="round"><rect x="0" y="0" width="1200" height="420" rx="20"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect x="0" y="0" width="1200" height="420" fill="#fcfbf8"/>
    <rect x="0" y="0" width="1200" height="420" fill="url(#grid)"/>

    <g fill="none" stroke="#111111" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M250 120 C 300 92, 332 116, 346 158" stroke-dasharray="150" stroke-dashoffset="150">
        <animate attributeName="stroke-dashoffset" values="150;0;0;150" keyTimes="0;0.3;0.9;1" dur="7s" repeatCount="indefinite"/>
      </path>
      <path d="M334 146 L 348 160 L 332 166" stroke-dasharray="60" stroke-dashoffset="60">
        <animate attributeName="stroke-dashoffset" values="60;0;0;60" keyTimes="0;0.34;0.9;1" dur="7s" repeatCount="indefinite"/>
      </path>
      <path d="M912 124 C 882 96, 866 122, 858 162" stroke-dasharray="155" stroke-dashoffset="155">
        <animate attributeName="stroke-dashoffset" values="155;0;0;155" keyTimes="0;0.3;0.9;1" dur="8s" repeatCount="indefinite" begin="0.8s"/>
      </path>
      <path d="M870 150 L 856 164 L 872 170" stroke-dasharray="60" stroke-dashoffset="60">
        <animate attributeName="stroke-dashoffset" values="60;0;0;60" keyTimes="0;0.34;0.9;1" dur="8s" repeatCount="indefinite" begin="0.8s"/>
      </path>
    </g>

    <g fill="#13a8ff">
      <circle cx="245" cy="232" r="4"><animate attributeName="opacity" values="1;0.25;1" dur="3s" repeatCount="indefinite"/></circle>
      <circle cx="958" cy="238" r="4"><animate attributeName="opacity" values="0.3;1;0.3" dur="4s" repeatCount="indefinite"/></circle>
    </g>
    <g fill="none" stroke="#13a8ff" stroke-width="2.6" stroke-linecap="round">
      <path d="M600 348 l0 -15 M592 340.5 l15 0"><animate attributeName="opacity" values="0.4;1;0.4" dur="4s" repeatCount="indefinite"/></path>
      <path d="M286 150 l0 -13 M279.5 143.5 l13 0"><animate attributeName="opacity" values="1;0.4;1" dur="3.5s" repeatCount="indefinite"/></path>
    </g>

    <rect x="340" y="156" width="520" height="120" rx="2" fill="rgba(19,168,255,0.05)" stroke="#13a8ff" stroke-width="3" stroke-dasharray="11 8">
      <animate attributeName="stroke-dashoffset" values="0;-76" dur="3.4s" repeatCount="indefinite"/>
    </rect>
    <g fill="#13a8ff" stroke="#050505" stroke-width="2.4">
      <rect x="333" y="149" width="13" height="13"/>
      <rect x="593.5" y="149" width="13" height="13"/>
      <rect x="854" y="149" width="13" height="13"/>
      <rect x="333" y="209.5" width="13" height="13"/>
      <rect x="854" y="209.5" width="13" height="13"/>
      <rect x="333" y="270" width="13" height="13"/>
      <rect x="593.5" y="270" width="13" height="13"/>
      <rect x="854" y="270" width="13" height="13"/>
