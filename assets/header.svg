      <circle cx="950" cy="225" r="4"><animate attributeName="opacity" values="0.3;1;0.3" dur="4s" repeatCount="indefinite"/></circle>
      <circle cx="600" cy="62" r="3.5"><animate attributeName="opacity" values="1;0.3;1" dur="3.5s" repeatCount="indefinite"/></circle>
    </g>
    <g fill="none" stroke="#13a8ff" stroke-width="2.4" stroke-linecap="round">
      <path d="M580 372 l0 -14 M573 365 l14 0"><animate attributeName="opacity" values="0.4;1;0.4" dur="4s" repeatCount="indefinite"/></path>
      <path d="M1010 110 l0 -12 M1004 104 l12 0"><animate attributeName="opacity" values="1;0.4;1" dur="3.5s" repeatCount="indefinite"/></path>
    </g>

    <rect x="340" y="152" width="520" height="128" fill="rgba(19,168,255,0.05)" stroke="#13a8ff" stroke-width="3" stroke-dasharray="11 8">
      <animate attributeName="stroke-dashoffset" values="0;-76" dur="3.2s" repeatCount="indefinite"/>
    </rect>
    <g fill="#13a8ff" stroke="#050505" stroke-width="2.5">
