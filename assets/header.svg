<svg width="100%" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="taha bakri — builder, tbilisi">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b0d13"/>
      <stop offset="1" stop-color="#0e1320"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.28" r="0.75">
      <stop offset="0" stop-color="#0f8ff5" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#0f8ff5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3ddbd0" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#4aa3ff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#7c5cff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1200" height="300" rx="18" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="300" rx="18" fill="url(#glow)"/>

  <g fill="none" stroke="url(#ink)" stroke-linecap="round">
    <path d="M-40,200 C260,120 520,250 760,180 S1120,120 1260,170" stroke-width="2" opacity="0.5">
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -10; 0 0" dur="9s" repeatCount="indefinite"/>
    </path>
    <path d="M-40,235 C300,180 560,300 820,225 S1160,180 1260,215" stroke-width="1.4" opacity="0.32">
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 9; 0 0" dur="11s" repeatCount="indefinite"/>
    </path>
    <path d="M-40,150 C320,90 640,170 960,110 S1220,92 1260,120" stroke-width="1" opacity="0.22">
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -7; 0 0" dur="13s" repeatCount="indefinite"/>
    </path>
  </g>

  <g fill="#cfe3ff">
