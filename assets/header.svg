      <text x="86" y="42" text-anchor="middle" font-family="'Comic Sans MS','Comic Neue',cursive" font-size="22" font-weight="700" fill="#0a3d2a">Restora</text>
      <text x="86" y="68" text-anchor="middle" font-family="'Comic Sans MS','Comic Neue',cursive" font-size="14" font-weight="700" fill="#1d5c44">Notion backup</text>
    </g>

    <g transform="translate(906,46) rotate(7)">
