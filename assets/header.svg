      <text x="93" y="68" text-anchor="middle" font-family="'Comic Sans MS','Comic Neue',cursive" font-size="14" font-weight="700" fill="#0f5573">npx → Obsidian</text>
    </g>

    <g transform="translate(96,286) rotate(6)">
      <animateTransform attributeName="transform" type="translate" additive="sum" values="0 0;0 -6;0 0" dur="4.6s" repeatCount="indefinite"/>
      <rect width="178" height="96" fill="#ffef9d"/>
      <rect x="64" y="-9" width="48" height="16" fill="rgba(90,95,105,0.25)" transform="rotate(6 88 -1)"/>
      <text x="89" y="42" text-anchor="middle" font-family="'Comic Sans MS','Comic Neue',cursive" font-size="21" font-weight="700" fill="#5a4500">StaffLoop</text>
      <text x="89" y="68" text-anchor="middle" font-family="'Comic Sans MS','Comic Neue',cursive" font-size="14" font-weight="700" fill="#7a5e00">event staffing · UAE</text>
