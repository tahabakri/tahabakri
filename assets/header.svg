      <rect width="186" height="96" fill="#ffc4a6"/>
      <rect x="68" y="-9" width="48" height="16" fill="rgba(90,95,105,0.25)" transform="rotate(-6 92 -1)"/>
      <text x="93" y="42" text-anchor="middle" font-family="'Comic Sans MS','Comic Neue',cursive" font-size="19" font-weight="700" fill="#7a2e0c">event apps</text>
