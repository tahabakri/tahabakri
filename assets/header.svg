    <circle cx="1060" cy="120" r="1.8" opacity="0.45"><animateTransform attributeName="transform" type="translate" values="0 0;-6 -8;0 0" dur="10s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.45;0.1;0.45" dur="7s" repeatCount="indefinite"/></circle>
    <circle cx="900" cy="185" r="2" opacity="0.5"><animateTransform attributeName="transform" type="translate" values="0 0;5 9;0 0" dur="9.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.5;0.12;0.5" dur="5.5s" repeatCount="indefinite"/></circle>
    <circle cx="1120" cy="205" r="2.2" opacity="0.55"><animateTransform attributeName="transform" type="translate" values="0 0;-8 -6;0 0" dur="12s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.55;0.15;0.55" dur="6.5s" repeatCount="indefinite"/></circle>
    <circle cx="1020" cy="245" r="1.5" opacity="0.4"><animateTransform attributeName="transform" type="translate" values="0 0;6 -10;0 0" dur="11.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.4;0.1;0.4" dur="8s" repeatCount="indefinite"/></circle>
    <circle cx="840" cy="95" r="1.6" opacity="0.4"><animateTransform attributeName="transform" type="translate" values="0 0;-5 7;0 0" dur="10.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.4;0.1;0.4" dur="7.5s" repeatCount="indefinite"/></circle>
    <circle cx="760" cy="140" r="1.4" opacity="0.35"><animateTransform attributeName="transform" type="translate" values="0 0;6 6;0 0" dur="9s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.35;0.08;0.35" dur="6s" repeatCount="indefinite"/></circle>
    <circle cx="1150" cy="95" r="1.8" opacity="0.45"><animateTransform attributeName="transform" type="translate" values="0 0;-6 9;0 0" dur="12.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.45;0.12;0.45" dur="7s" repeatCount="indefinite"/></circle>
    <circle cx="700" cy="62" r="1.4" opacity="0.35"><animateTransform attributeName="transform" type="translate" values="0 0;5 8;0 0" dur="10s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.35;0.09;0.35" dur="6.5s" repeatCount="indefinite"/></circle>
    <circle cx="960" cy="262" r="1.6" opacity="0.4"><animateTransform attributeName="transform" type="translate" values="0 0;-7 -7;0 0" dur="11s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.4;0.1;0.4" dur="7.5s" repeatCount="indefinite"/></circle>
    <circle cx="1085" cy="44" r="1.5" opacity="0.4"><animateTransform attributeName="transform" type="translate" values="0 0;6 9;0 0" dur="9.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.4;0.1;0.4" dur="6s" repeatCount="indefinite"/></circle>
    <circle cx="880" cy="42" r="1.3" opacity="0.35"><animateTransform attributeName="transform" type="translate" values="0 0;-5 8;0 0" dur="12s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.35;0.08;0.35" dur="8s" repeatCount="indefinite"/></circle>
    <circle cx="640" cy="212" r="1.6" opacity="0.4"><animateTransform attributeName="transform" type="translate" values="0 0;7 -8;0 0" dur="10.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.4;0.1;0.4" dur="7s" repeatCount="indefinite"/></circle>
    <circle cx="560" cy="120" r="1.3" opacity="0.3"><animateTransform attributeName="transform" type="translate" values="0 0;-6 7;0 0" dur="11.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.3;0.08;0.3" dur="6.5s" repeatCount="indefinite"/></circle>
    <circle cx="430" cy="86" r="1.4" opacity="0.32"><animateTransform attributeName="transform" type="translate" values="0 0;6 8;0 0" dur="13s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.32;0.08;0.32" dur="7.5s" repeatCount="indefinite"/></circle>
    <circle cx="1180" cy="262" r="1.6" opacity="0.4"><animateTransform attributeName="transform" type="translate" values="0 0;-6 -9;0 0" dur="10s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.4;0.1;0.4" dur="6s" repeatCount="indefinite"/></circle>
  </g>

  <rect x="-300" y="0" width="300" height="300" fill="url(#sweep)">
