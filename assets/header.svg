      <rect x="58" y="-9" width="46" height="15" fill="rgba(90,95,105,0.22)" transform="rotate(5 81 -1.5)"/>
      <text x="84" y="40" text-anchor="middle" font-family="'Comic Sans MS','Comic Neue',cursive" font-size="20" font-weight="700" fill="#0a3d2a">Restora</text>
      <text x="84" y="65" text-anchor="middle" font-family="'Comic Sans MS','Comic Neue',cursive" font-size="13" font-weight="700" fill="#256b50">Notion backup</text>
    </g>

    <g transform="translate(914,46) rotate(6)">
      <animateTransform attributeName="transform" type="translate" additive="sum" values="0 0;0 6;0 0" dur="5.2s" repeatCount="indefinite"/>
      <rect x="4" y="6" width="182" height="92" fill="rgba(0,0,0,0.06)"/>
