<svg width="100%" viewBox="0 0 1200 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="taha bakri — builder, tbilisi. A brainstorm board of projects: Restora, notion-bases, StaffLoop, event marketplaces.">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ececec" stroke-width="1"/>
    </pattern>
    <clipPath id="round"><rect x="0" y="0" width="1200" height="420" rx="20"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect x="0" y="0" width="1200" height="420" fill="#fcfbf8"/>
    <rect x="0" y="0" width="1200" height="420" fill="url(#grid)"/>

    <g fill="none" stroke="#0a0a0a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M300 120 C 360 70 430 80 470 140" stroke-dasharray="170" stroke-dashoffset="170">
        <animate attributeName="stroke-dashoffset" values="170;0;0;170" keyTimes="0;0.35;0.85;1" dur="7s" repeatCount="indefinite"/>
      </path>
      <path d="M455 120 L 472 142 L 446 150" stroke-dasharray="70" stroke-dashoffset="70">
        <animate attributeName="stroke-dashoffset" values="70;0;0;70" keyTimes="0;0.4;0.85;1" dur="7s" repeatCount="indefinite"/>
      </path>
      <path d="M905 150 C 840 110 800 150 760 200" stroke-dasharray="180" stroke-dashoffset="180">
        <animate attributeName="stroke-dashoffset" values="180;0;0;180" keyTimes="0;0.4;0.85;1" dur="8s" repeatCount="indefinite" begin="1s"/>
      </path>
      <path d="M775 180 L 757 203 L 785 208" stroke-dasharray="70" stroke-dashoffset="70">
        <animate attributeName="stroke-dashoffset" values="70;0;0;70" keyTimes="0;0.45;0.85;1" dur="8s" repeatCount="indefinite" begin="1s"/>
      </path>
    </g>

    <g fill="#13a8ff">
