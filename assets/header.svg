      <rect x="593" y="145" width="14" height="14"/>
      <rect x="853" y="145" width="14" height="14"/>
      <rect x="333" y="209" width="14" height="14"/>
      <rect x="853" y="209" width="14" height="14"/>
      <rect x="333" y="273" width="14" height="14"/>
      <rect x="593" y="273" width="14" height="14"/>
      <rect x="853" y="273" width="14" height="14"/>
