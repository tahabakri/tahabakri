    <text x="600" y="304" text-anchor="middle" font-family="'Comic Sans MS','Comic Neue',cursive" font-size="20" font-weight="700" fill="#5a6577">builder · tbilisi · ships fast</text>

    <g transform="translate(74,52) rotate(-7)">
